name: devin-bridge

# Forwards PR feedback to the Devin session linked to the PR, and handles
# `/bridge review` and `/bridge <prompt>`. Setup: https://github.com/StationedAI/devin-bridge
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      action:
        description: "review-all = trigger Devin Review on every open PR"
        default: review-all
        type: choice
        options: [review-all]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  bridge:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: StationedAI/devin-bridge@v1
        with:
          secrets: ${{ toJSON(secrets) }}
          user-orgs: ${{ vars.DEVIN_USER_ORGS }}
          owner-org-id: ${{ vars.OWNER_DEVIN_ORG_ID }}
